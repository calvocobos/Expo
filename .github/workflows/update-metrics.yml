name: Actualizar métricas de visitas y descargas

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install jsdom node-fetch
      - name: Ejecutar script de scraping
        run: node scripts/metrics.js
      - name: Commit y push del JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add metrics.json
          git commit -m "Actualizar metrics.json automáticamente" || echo "No hay cambios para commitear"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
