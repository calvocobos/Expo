name: Verificar indexación de tesis

on:
  schedule:
    #- cron: "0 9 * * 1" # Lunes 09:00 UTC
    - cron: "0 9 * * *" # Todos los días 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexing-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar validación
        run: node scripts/metrics.js

      - name: Commit cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add metrics/indexing.json
          git commit -m "chore: actualización de indexación de tesis" || echo "Sin cambios"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/calvocobos/Expo.git HEAD:main
