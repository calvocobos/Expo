name: Actualizar métricas de visitas y descargas

on:
  schedule:
    - cron: '30 10 * * *' # todos los días a las 10:30 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install puppeteer

      - name: Ejecutar script de scraping
        run: node scripts/metrics.js

      - name: Mostrar metrics.json
        run: cat metrics.json

      - name: Commit y push del JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add metrics.json
          git commit -m "Actualizar metrics.json automáticamente" || echo "No hay cambios para commitear"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/calvocobos/Expo.git HEAD:main
